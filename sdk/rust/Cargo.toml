[package]
name = "cmp-context"
version = "0.1.0"
edition = "2021"
publish = false
description = "CMP context protocol SDK, development stage"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
url = "2"
toml = "0.8"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
fs2 = "0.4"
dialoguer = "0.11"
console = "0.15"


[lib]
name = "cmp_context"
path = "src/lib.rs"
