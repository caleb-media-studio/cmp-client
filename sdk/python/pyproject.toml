[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmp-context"
version = "0.1.0"
description = "Development-stage Python client for CMP"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
stream = ["websockets>=14,<17"]

[tool.setuptools.packages.find]
where = ["src"]
